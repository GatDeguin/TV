/* Pure media utilities. No network, DOM or rendering dependencies. */
const TVCore = (() => {
  const clamp=(v,a,b)=>Math.min(b,Math.max(a,Number.isFinite(v)?v:a));
  const wrap=(i,n)=>n>0?((i%n)+n)%n:0;
  const seekTo=(t,delta,duration)=>Number.isFinite(duration)&&duration>0?clamp(t+delta,0,duration):0;
  const isVideo=f=>!!f&&(/^(video)\//i.test(f.type||'')||/\.(mp4|m4v|webm|ogv|mov)$/i.test(f.name||''));
  const time=t=>{t=Math.floor(Number.isFinite(t)?Math.max(0,t):0);const s=String(t%60).padStart(2,'0'),m=String(Math.floor(t/60)%60).padStart(2,'0');return t>=3600?`${Math.floor(t/3600)}:${m}:${s}`:`${m}:${s}`};
  const parseSubs=text=>{const out=[], stamp=s=>s.replace(',','.').split(':').reduce((a,v)=>a*60+Number(v),0); for(const b of String(text).replace(/\r/g,'').split(/\n\s*\n/)){const ls=b.trim().split('\n'),i=ls.findIndex(l=>l.includes('-->'));if(i<0)continue;const m=ls[i].match(/([\d:. ,]+)\s*-->\s*([\d:.,]+)/);if(!m)continue;const start=stamp(m[1].trim()),end=stamp(m[2]);if(Number.isFinite(start)&&end>start)out.push({start,end,text:ls.slice(i+1).join('\n').replace(/<[^>]*>/g,'').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').slice(0,1000)});}return out.sort((a,b)=>a.start-b.start)};
  return {clamp,wrap,seekTo,isVideo,time,parseSubs};
})();
if(typeof module!=='undefined')module.exports=TVCore;
